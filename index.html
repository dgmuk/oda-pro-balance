<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODA PRO: Body Balance System</title>

    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Global Error Handler (Non-Babel) -->
    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            document.body.innerHTML = '<div style="color:red; padding:20px; background:white; z-index:9999; position:relative;"><h1>Error</h1><p>' + message + '</p><p>' + source + ':' + lineno + '</p><pre>' + (error ? error.stack : '') + '</pre></div>';
        };
        window.addEventListener('unhandledrejection', function (event) {
            document.body.innerHTML = '<div style="color:red; padding:20px; background:white; z-index:9999; position:relative;"><h1>Unhandled Promise Rejection</h1><p>' + event.reason + '</p></div>';
        });
    </script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gray: {
                            800: '#1f2937',
                            900: '#111827',
                        },
                        orange: {
                            500: '#f97316',
                            600: '#ea580c',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            /* gray-900 */
            color: #f3f4f6;
            /* gray-100 */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* Print Styles */
        @media print {
            body {
                background-color: white;
                color: black;
            }

            .no-print {
                display: none !important;
            }

            .print-only {
                display: block !important;
            }

            .card {
                break-inside: avoid;
                border: 1px solid #ddd;
                box-shadow: none;
                margin-bottom: 20px;
            }
        }

        .print-only {
            display: none;
        }

        .schematic-card svg {
            display: block;
        }

        @media print {
            .schematic-card {
                break-inside: avoid;
            }
            .schematic-card svg {
                max-height: 150px;
            }
        }
    </style>
</head>

    <div id="root"></div>

                name: "Мульти-плоскостные выпады",

                steps: [

                ]

        // --- VISUAL SYSTEM ---

        const V = {
            ink: '#9ca3af',
            heat: '#f97316',
            heatFill: 'rgba(249,115,22,0.32)',
            teal: '#2dd4bf',
            tealFill: 'rgba(45,212,191,0.32)',
            ok: '#34d399',
            bad: '#f87171',
            gear: '#f3f4f6',
            wall: '#6b7280',
            ground: '#374151'
        };

        const limb = (x1, y1, x2, y2, color = V.ink, w = 3.3) => (
            <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={color} strokeWidth={w} strokeLinecap="round" />
        );

        const Schematic = ({ caption, children, badge }) => (
            <div className="schematic-card rounded-xl bg-gray-900/80 border border-gray-700 overflow-hidden print:bg-white print:border-gray-300">
                {badge && (
                    <div className={`text-[10px] font-bold uppercase tracking-wider text-center py-1 ${badge === 'ok' ? 'bg-emerald-500/20 text-emerald-400 print:text-emerald-700' : 'bg-red-500/20 text-red-400 print:text-red-700'}`}>
                        {badge === 'ok' ? 'Норма' : 'Ошибка'}
                    </div>
                )}
                <svg viewBox="0 0 200 168" className="w-full h-auto block">{children}</svg>
                {caption && <p className="text-[11px] leading-snug text-gray-400 text-center px-2 pb-2 print:text-gray-600">{caption}</p>}
            </div>
        );

        const Ground = () => <line x1="28" y1="152" x2="172" y2="152" stroke={V.ground} strokeWidth="2" />;
        const WallV = ({ x = 168 }) => <line x1={x} y1="18" x2={x} y2="152" stroke={V.wall} strokeWidth="6" strokeLinecap="round" />;
        const Ball = ({ x, y, r = 8 }) => <circle cx={x} cy={y} r={r} fill={V.gear} stroke={V.heat} strokeWidth="1.5" />;
        const Roller = ({ x, y, w = 46, h = 12 }) => <rect x={x} y={y} width={w} height={h} rx="6" fill={V.gear} stroke={V.heat} strokeWidth="1.4" />;
        const Heat = ({ cx, cy, rx = 12, ry = 10 }) => <ellipse cx={cx} cy={cy} rx={rx} ry={ry} fill={V.heatFill} />;
        const Arrow = ({ x1, y1, x2, y2, color = V.heat }) => {
            const a = Math.atan2(y2 - y1, x2 - x1);
            const x3 = x2 - 7 * Math.cos(a - 0.45);
            const y3 = y2 - 7 * Math.sin(a - 0.45);
            const x4 = x2 - 7 * Math.cos(a + 0.45);
            const y4 = y2 - 7 * Math.sin(a + 0.45);
            return (
                <g>
                    <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={color} strokeWidth="2" />
                    <polygon points={`${x2},${y2} ${x3},${y3} ${x4},${y4}`} fill={color} />
                </g>
            );
        };

        const SideBody = ({
            color = V.ink,
            headFwd = 0,
            roundSh = 0,
            pelvis = 0,
            lean = 0,
            squat = 0,
            arms = 'down',
            heel = 0,
            arch = 0,
            ox = 0
        }) => {
            const ax = 96 + ox, ay = 152 - heel * 12;
            const kx = ax + 6 + squat * 26;
            const ky = 112 + squat * 6 - heel * 4;
            const hx = ax - 4 - squat * 16 - pelvis * 10 + lean * 4;
            const hy = 74 + squat * 20;
            const sx = hx + lean * 24 + roundSh * 10;
            const sy = hy - 38 + squat * 6;
            const cx = sx + 3 + headFwd * 14;
            const cy = sy - 20;

                            howTo: 'Клиент пытается соединить руки за спиной (одна сверху, другая снизу).',
                            whatToLookFor: 'Пальцы не соприкасаются. Разница между правой и левой стороной существенна.'
                        }
                    ]
                },
                {
                    title: "Тазобедренный сустав (Тест Томаса)",
                    items: [
                        {
                            id: 'thomas_hip_flexor',
                            label: 'Бедро приподнято (Psoas)',
                            howTo: 'Клиент лежит на краю кушетки, подтягивает одно колено к груди, вторая нога свисает.',
                            whatToLookFor: 'Бедро свисающей ноги поднимается выше горизонтали (не касается поверхности).'
                        },
                        {
                            id: 'thomas_rectus',
                            label: 'Колено разогнуто (Rectus Femoris)',
                            howTo: 'В том же положении (тест Томаса) оцените положение голени.',
                            whatToLookFor: 'Голень не свисает вертикально (угол в колене больше 90 градусов, нога выпрямляется).'
                        },
                        {
                            id: 'thomas_tfl',
                            label: 'Бедро отводится (TFL)',
                            howTo: 'В том же положении посмотрите, не уходит ли нога в сторону.',
                            whatToLookFor: 'Бедро отклоняется наружу (абдукция).'
                        }
                    ]
                },
                {
                    title: "Голеностоп и Бедро",
                    items: [
                        {
                            id: 'knee_wall_fail',
                            label: 'Тест колено-стена (<10см)',
                            howTo: 'Клиент стоит лицом к стене, стопа на расстоянии 10-12 см. Пытается коснуться стены коленом, не отрывая пятку.',
                            whatToLookFor: 'Колено не достает до стены или пятка отрывается от пола.'
                        },
                        {
                            id: 'aslr_fail',
                            label: 'Активный подъем ноги (<80°)',
                            howTo: 'Клиент лежит на спине. Поднимает одну прямую ногу вверх.',
                            whatToLookFor: 'Угол подъема ноги меньше 80 градусов (лодыжка не проходит линию середины бедра второй ноги).'
                        }
                    ]
                }
            ];

            return (
                <div className="animate-fade-in">
                    <h2 className="text-2xl font-bold mb-6 text-white">Мобильность и Спец. тесты</h2>
                    <div className="grid md:grid-cols-3 gap-6">
                        {groups.map((group, idx) => (
                            <CheckboxGroup
                                key={idx}
                                title={group.title}
                                items={group.items}
                                values={data}
                                onChange={(id) => updateData(id, !data[id])}
                                onInfoClick={setInfoModal}
                            />
                        ))}
                    </div>

                    <Modal isOpen={!!infoModal} onClose={() => setInfoModal(null)} title={infoModal?.label}>
                        <TestInfoContent
                            howTo={infoModal?.howTo}
                            whatToLookFor={infoModal?.whatToLookFor}
                            testId={infoModal?.id}
                            onClose={() => setInfoModal(null)}
                        />
                    </Modal>
                </div>
            );
        };

        // --- REPORT & LOGIC ---
        // NASM CES: finding → overactive/underactive muscle → phase exercise.
        // Syndromes are labels. The plan is muscle-driven.

        const MUSCLES = {
            upper_trap: { name: 'Верхняя трапеция', inhibit: 'smr_upper_trap', lengthen: 'stretch_neck_side' },
            levator: { name: 'Лестничные / levator', inhibit: 'smr_upper_trap', lengthen: 'stretch_neck_side' },
            scm: { name: 'ГКС мышца', lengthen: 'stretch_neck_side' },
            pecs: { name: 'Грудные', inhibit: 'smr_pecs', lengthen: 'stretch_doorway_pec' },
            lats: { name: 'Широчайшие', inhibit: 'smr_lats', lengthen: 'stretch_lats' },
            teres_major: { name: 'Большая круглая', inhibit: 'smr_lats', lengthen: 'stretch_lats' },
            psoas: { name: 'Подвздошно-поясничная', inhibit: 'smr_psoas', lengthen: 'stretch_hip_flexor', activate: 'act_bird_dog' },
            rectus_femoris: { name: 'Прямая мышца бедра', inhibit: 'smr_quads', lengthen: 'stretch_quad_stand' },
            tfl: { name: 'TFL', inhibit: 'smr_tfl', lengthen: 'stretch_hip_flexor' },
            adductors: { name: 'Приводящие', inhibit: 'smr_adductors', lengthen: 'stretch_adductor_stand' },
            calves: { name: 'Икроножные / камбаловидная', inhibit: 'smr_calves', lengthen: 'stretch_calf_wall' },
            hamstrings: { name: 'Хамстринги', inhibit: 'smr_hamstrings', lengthen: 'stretch_hamstring_supine' },
            erectors: { name: 'Разгибатели позвоночника', activate: 'act_bird_dog' },
            abs: { name: 'Прямая мышца живота' },
            deep_neck_flexors: { name: 'Глубокие сгибатели шеи', activate: 'act_chin_tuck' },
            mid_trap: { name: 'Средняя/нижняя трапеция', activate: 'act_ytw' },
            lower_trap: { name: 'Нижняя трапеция', activate: 'act_ytw' },
            rhomboids: { name: 'Ромбовидные', activate: 'act_ytw' },
            rotator_cuff: { name: 'Ротаторная манжета', activate: 'act_ytw' },
            glute_max: { name: 'Большая ягодичная', activate: 'act_glute_bridge' },
            glute_med: { name: 'Средняя ягодичная', activate: 'act_clamshell' },
            core: { name: 'Глубокий кор', activate: 'act_plank_rkc' },
            tibialis: { name: 'Передняя большеберцовая', activate: 'act_tibialis' }
        };

        const FINDING_MAP = {
            forward_head: {
                label: 'Голова выдвинута вперёд',
                over: [['upper_trap', 2], ['levator', 2], ['scm', 1]],
                under: [['deep_neck_flexors', 2]],
                syn: { ucs: 2 }
            },
            rounded_shoulders: {
                label: 'Округлые плечи',
                over: [['pecs', 2], ['upper_trap', 1], ['lats', 1]],
                under: [['mid_trap', 2], ['rhomboids', 2], ['lower_trap', 1]],
                syn: { ucs: 2 }
            },
            arms_fall: {
                label: 'Руки падают вперёд',
                over: [['lats', 2], ['pecs', 2], ['teres_major', 1]],
                under: [['mid_trap', 2], ['rhomboids', 1], ['rotator_cuff', 1]],
                syn: { ucs: 2 }
            },
            neck_restrict: {
                label: 'Ограничение сгибания шеи',
                over: [['upper_trap', 2], ['levator', 2], ['scm', 1]],
                under: [['deep_neck_flexors', 2]],
                syn: { ucs: 3 }
            },
            apley_fail: {
                label: 'Тест Эпли не пройден',
                over: [['lats', 2], ['pecs', 2], ['teres_major', 1]],
                under: [['rotator_cuff', 2], ['mid_trap', 1]],
                syn: { ucs: 3 }
            },
            hyperlordosis: {
                label: 'Гиперлордоз / передний наклон таза',
                over: [['psoas', 2], ['rectus_femoris', 1], ['erectors', 1]],
                under: [['glute_max', 2], ['core', 2]],
                syn: { lcs: 2 }
            },
            flat_back: {
                label: 'Плоская спина / задний наклон таза',
                over: [['hamstrings', 2], ['abs', 1]],
                under: [['erectors', 2], ['psoas', 1]],
                syn: { lcs_b: 3 }
            },
            excessive_lean: {
                label: 'Избыточный наклон вперёд',
                over: [['calves', 2], ['psoas', 1], ['abs', 1]],
                under: [['tibialis', 1], ['glute_max', 2], ['erectors', 1]],
                syn: { lcs: 1, pds: 1 }
            },
            low_back_arch: {
                label: 'Прогиб в пояснице в приседе',
                over: [['psoas', 2], ['erectors', 1], ['lats', 1]],
                under: [['glute_max', 2], ['core', 2], ['hamstrings', 1]],
                syn: { lcs: 2 }
            },
            thomas_hip_flexor: {
                label: 'Тест Томаса: psoas',
                over: [['psoas', 3]],
                under: [['glute_max', 2]],
                syn: { lcs: 3 }
            },
            thomas_rectus: {
                label: 'Тест Томаса: rectus femoris',
                over: [['rectus_femoris', 3]],
                under: [['glute_max', 1]],
                syn: { lcs: 3 }
            },
            thomas_tfl: {
                label: 'Тест Томаса: TFL',
                over: [['tfl', 3]],
                under: [['glute_med', 2]],
                syn: { pds: 2, lcs: 1 }
            },
            aslr_fail: {
                label: 'ASLR < 80°',
                over: [['hamstrings', 3]],
                under: [['core', 1]],
                syn: { lcs_b: 2 }
            },
            knee_valgus_static: {
                label: 'Вальгус коленей (статика)',
                over: [['adductors', 2], ['tfl', 2]],
                under: [['glute_med', 2], ['glute_max', 1]],
                syn: { pds: 2 }
            },
            flat_feet: {
                label: 'Плоскостопие / пронация',
                over: [['calves', 2]],
                under: [['tibialis', 2]],
                syn: { pds: 2 }
            },
            feet_turn_out: {
                label: 'Стопы разворачиваются наружу',
                over: [['calves', 2], ['hamstrings', 1], ['tfl', 1]],
                under: [['glute_med', 2], ['glute_max', 1]],
                syn: { pds: 2 }
            },
            knees_cave_in: {
                label: 'Колени сводятся в приседе',
                over: [['adductors', 2], ['tfl', 2]],
                under: [['glute_med', 3], ['glute_max', 1]],
                syn: { pds: 2 }
            },
            heels_rise: {
                label: 'Пятки отрываются от пола',
                over: [['calves', 3]],
                under: [['tibialis', 2]],
                syn: { pds: 3 }
            },
            knee_wall_fail: {
                label: 'Тест колено–стена не пройден',
                over: [['calves', 3]],
                under: [['tibialis', 2]],
                syn: { pds: 3 }
            },
            asym_shift: {
                label: 'Асимметричное смещение таза',
                over: [['tfl', 2], ['adductors', 1]],
                under: [['glute_med', 3]],
                syn: { pds: 2, lcs: 1 }
            }
        };

        const SYNDROME_META = {
            ucs: { name: 'Верхний перекрестный синдром', desc: 'Дисбаланс мышц плечевого пояса и шеи.', max: 12, threshold: 3 },
            lcs: { name: 'Нижний перекрестный синдром (передний наклон таза)', desc: 'Укороченные сгибатели бедра и разгибатели, слабые ягодицы и кор.', max: 13, threshold: 3 },
            lcs_b: { name: 'Задний наклон таза / плоская спина', desc: 'Укороченные хамстринги, слабые разгибатели и сгибатели бедра.', max: 5, threshold: 3 },
            pds: { name: 'Синдром пронационных искажений', desc: 'Нарушение биомеханики стоп, голени и коленей.', max: 19, threshold: 4 }
        };

        const PHASE_DOSE = {
            inhibit: '30–60 сек на точку, 1–2 подхода',
            lengthen: '30–45 сек, 2 подхода',
            activate: '2 × 10–15',
            integrate: '2 × 8–12'
        };

        const EXERCISE_DOSE = {
            act_plank_rkc: '10–20 сек, 2–3 подхода',
            act_chin_tuck: '10–15 повторений, пауза 2–3 сек',
            int_single_leg_balance: '30–60 сек на ногу × 2',
            act_bird_dog: '6–8 повторений на сторону',
            smr_psoas: '30–45 сек, без давления на пульсацию'
        };

        const doseFor = (exId, phase) => EXERCISE_DOSE[exId] || PHASE_DOSE[phase];

        const severityOf = (score, max) => {
            const r = score / max;
            if (r >= 0.65) return { id: 'high', label: 'выраженный' };
            if (r >= 0.35) return { id: 'mid', label: 'умеренный' };
            return { id: 'low', label: 'лёгкий' };
        };

        const resolveConflicts = (data) => {
            const active = { ...data };
            const notes = [];
            if (active.hyperlordosis && active.flat_back) {
                const ant = (active.low_back_arch ? 2 : 0) + (active.thomas_hip_flexor ? 3 : 0) + (active.thomas_rectus ? 3 : 0);
                const post = active.aslr_fail ? 3 : 0;
                if (ant >= post) {
                    active.flat_back = false;
                    notes.push('Конфликт таза: отмечены и гиперлордоз, и плоская спина. По сопутствующим тестам в расчёт взят передний наклон.');
                } else {
                    active.hyperlordosis = false;
                    notes.push('Конфликт таза: по ASLR в расчёт взят задний наклон, гиперлордоз исключён.');
                }
            }
            return { active, notes };
        };

        const pushRx = (bucket, exId, phase, score, why, muscleName) => {
            if (!exId || !exerciseLibrary[exId]) return;
            const existing = bucket.get(exId);
            if (existing) {
                existing.score += score;
                why.forEach(w => existing.whySet.add(w));
                if (muscleName) existing.muscles.add(muscleName);
            } else {
                bucket.set(exId, {
                    id: exId,
                    score,
                    phase,
                    dose: doseFor(exId, phase),
                    whySet: new Set(why),
                    muscles: new Set(muscleName ? [muscleName] : [])
                });
            }
        };

        const finalizeRx = (bucket, cap) =>
            [...bucket.values()]
                .sort((a, b) => b.score - a.score)
                .slice(0, cap)
                .map(item => ({
                    id: item.id,
                    dose: item.dose,
                    score: item.score,
                    why: [...item.whySet].join(', '),
                    muscles: [...item.muscles].join(', ')
                }));

        const buildCorrectivePlan = (data) => {
            const { active, notes } = resolveConflicts(data);
            const triggered = Object.keys(FINDING_MAP).filter(id => active[id]);

            const muscleState = {};
            const synScores = { ucs: 0, lcs: 0, lcs_b: 0, pds: 0 };
            const synFindings = { ucs: [], lcs: [], lcs_b: [], pds: [] };

            const ensureMuscle = (id) => {
                if (!muscleState[id]) muscleState[id] = { over: 0, under: 0, overWhy: [], underWhy: [] };
                return muscleState[id];
            };

            triggered.forEach(fid => {
                const f = FINDING_MAP[fid];
                (f.over || []).forEach(([mid, w]) => {
                    const m = ensureMuscle(mid);
                    m.over += w;
                    m.overWhy.push(f.label);
                });
                (f.under || []).forEach(([mid, w]) => {
                    const m = ensureMuscle(mid);
                    m.under += w;
                    m.underWhy.push(f.label);
                });
                Object.entries(f.syn || {}).forEach(([sid, w]) => {
                    if (fid === 'excessive_lean' && active.flat_back && !active.hyperlordosis && sid === 'lcs') return;
                    synScores[sid] += w;
                    synFindings[sid].push(f.label);
                });
            });

            const overactive = [];
            const underactive = [];
            Object.entries(muscleState).forEach(([id, s]) => {
                const net = s.over - s.under;
                const meta = MUSCLES[id];
                if (!meta) return;
                if (net > 0 && s.over >= 2) {
                    overactive.push({ id, name: meta.name, score: s.over, why: [...new Set(s.overWhy)], ...meta });
                } else if (net < 0 && s.under >= 2) {
                    underactive.push({ id, name: meta.name, score: s.under, why: [...new Set(s.underWhy)], ...meta });
                } else if (net === 0 && s.over >= 2) {
                    overactive.push({ id, name: meta.name, score: s.over, why: [...new Set(s.overWhy)], ...meta });
                }
            });
            overactive.sort((a, b) => b.score - a.score);
            underactive.sort((a, b) => b.score - a.score);

            const inhibit = new Map();
            const lengthen = new Map();
            const activate = new Map();
            const integrate = new Map();

            overactive.forEach(m => {
                pushRx(inhibit, m.inhibit, 'inhibit', m.score, m.why, m.name);
                pushRx(lengthen, m.lengthen, 'lengthen', m.score, m.why, m.name);
            });
            underactive.forEach(m => {
                pushRx(activate, m.activate, 'activate', m.score, m.why, m.name);
            });

            const addIntegrate = (exId, score, why) => pushRx(integrate, exId, 'integrate', score, why, null);
            if (synScores.ucs >= SYNDROME_META.ucs.threshold) addIntegrate('int_single_arm_row', synScores.ucs, synFindings.ucs);
            if (synScores.lcs >= SYNDROME_META.lcs.threshold) {
                addIntegrate('int_squat_row', synScores.lcs, synFindings.lcs);
                addIntegrate('int_lunge_rot', synScores.lcs - 1, synFindings.lcs);
            }
            if (synScores.lcs_b >= SYNDROME_META.lcs_b.threshold) addIntegrate('int_squat_row', synScores.lcs_b, synFindings.lcs_b);
            if (synScores.pds >= SYNDROME_META.pds.threshold || active.asym_shift || active.knees_cave_in) {
                addIntegrate('int_single_leg_balance', synScores.pds + (active.asym_shift ? 2 : 0), synFindings.pds);
                addIntegrate('int_multi_lunge', synScores.pds, synFindings.pds);
            }
            if (integrate.size === 0 && (overactive.length || underactive.length)) {
                if (overactive.some(m => ['upper_trap', 'pecs', 'lats'].includes(m.id))) addIntegrate('int_single_arm_row', 2, triggered.map(id => FINDING_MAP[id].label));
                else addIntegrate('int_single_leg_balance', 2, triggered.map(id => FINDING_MAP[id].label));
            }

            const syndromes = Object.entries(SYNDROME_META)
                .filter(([id, meta]) => synScores[id] >= meta.threshold)
                .sort((a, b) => synScores[b[0]] - synScores[a[0]])
                .map(([id, meta]) => {
                    const score = synScores[id];
                    const sev = severityOf(score, meta.max);
                    return {
                        id,
                        name: meta.name,
                        desc: meta.desc,
                        score,
                        max: meta.max,
                        severity: sev.label,
                        severityId: sev.id,
                        findings: [...new Set(synFindings[id])]
                    };
                });

            return {
                triggered: triggered.map(id => ({ id, label: FINDING_MAP[id].label })),
                notes,
                syndromes,
                overactive: overactive.map(m => ({ id: m.id, name: m.name, score: m.score })),
                underactive: underactive.map(m => ({ id: m.id, name: m.name, score: m.score })),
                plan: {
                    inhibit: finalizeRx(inhibit, 4),
                    lengthen: finalizeRx(lengthen, 4),
                    activate: finalizeRx(activate, 3),
                    integrate: finalizeRx(integrate, 2)
                }
            };
        };

        // --- BODY MAP COMPONENT ---

        const BodyMap = ({ overactive = [], underactive = [] }) => {
            const maxOver = Math.max(1, ...overactive.map(m => m.score));
            const maxUnder = Math.max(1, ...underactive.map(m => m.score));
            const topOver = overactive.slice(0, 3);

            return (
                <div className="flex flex-col items-center justify-center bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg h-full">
                    <h3 className="text-xl font-bold text-white mb-4">Карта дисбалансов</h3>
                    <div className="relative w-full max-w-[320px] aspect-square">
                        <svg viewBox="0 0 512 512" className="w-full h-full drop-shadow-2xl" preserveAspectRatio="xMidYMid meet">
                            <defs>
                                <filter id="glow-over" x="-50%" y="-50%" width="200%" height="200%">
                                    <feGaussianBlur stdDeviation="6" result="coloredBlur" />
                                    <feMerge>
                                        <feMergeNode in="coloredBlur" />
                                        <feMergeNode in="SourceGraphic" />
                                    </feMerge>
                                </filter>
                                <filter id="glow-under" x="-50%" y="-50%" width="200%" height="200%">
                                    <feGaussianBlur stdDeviation="6" result="coloredBlur" />
                                    <feMerge>
                                        <feMergeNode in="coloredBlur" />
                                        <feMergeNode in="SourceGraphic" />
                                    </feMerge>
                                </filter>
                            </defs>
                            <image href="body_anatomy.png" x="0" y="0" width="512" height="512" />
                            {overactive.map(m => (MUSCLE_ZONES[m.id] || []).map((z, i) => (
                                <ellipse
                                    key={`o-${m.id}-${i}`}
                                    cx={z.cx} cy={z.cy} rx={z.rx} ry={z.ry}
                                    fill="rgba(249,115,22,0.55)"
                                    opacity={0.35 + (m.score / maxOver) * 0.5}
                                    filter="url(#glow-over)"
                                />
                            )))}
                            {underactive.map(m => (MUSCLE_ZONES[m.id] || []).map((z, i) => (
                                <ellipse
                                    key={`u-${m.id}-${i}`}
                                    cx={z.cx} cy={z.cy} rx={z.rx} ry={z.ry}
                                    fill="rgba(45,212,191,0.5)"
                                    opacity={0.3 + (m.score / maxUnder) * 0.45}
                                    filter="url(#glow-under)"
                                />
                            )))}
                        </svg>
                    </div>
                    {topOver.length > 0 && (
                        <div className="flex flex-wrap justify-center gap-1.5 mt-3">
                            {topOver.map(m => (
                                <span key={m.id} className="text-[10px] bg-orange-500/90 text-white px-2 py-0.5 rounded">{m.name}</span>
                            ))}
                        </div>
                    )}
                    <div className="flex items-center justify-center gap-4 mt-3 text-xs text-gray-400">
                        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-orange-500"></span> укороченные</span>
                        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-teal-400"></span> ослабленные</span>
                    </div>
                </div>
            );
        };

        const ExerciseCard = ({ item, onClick }) => {
            const ex = exerciseLibrary[item.id];
            if (!ex) return null;
            return (
                <div
                    onClick={() => onClick({ ...ex, id: item.id, dose: item.dose, why: item.why, muscles: item.muscles })}
                    className="bg-gray-800 p-4 rounded-lg border border-gray-700 hover:border-orange-500 cursor-pointer transition-all hover:shadow-lg hover:shadow-orange-500/10 group h-full flex flex-col print:border-gray-300 print:bg-white print:shadow-none print:h-auto print:block print:break-inside-avoid"
                >
                    <div className="mb-3 -mx-1 print:mx-0">
                        <ExDiagram id={item.id} />
                    </div>
                    <h5 className="font-bold text-white mb-2 group-hover:text-orange-400 transition-colors print:text-black print:text-lg">{ex.name}</h5>
                    <p className="text-sm text-gray-400 line-clamp-2 flex-grow print:text-gray-800 print:line-clamp-none">{ex.desc}</p>
                    {item.dose && (
                        <p className="text-xs text-orange-400/90 mt-3 font-medium print:text-orange-700">{item.dose}</p>
                    )}
                    {item.why && (
                        <p className="text-xs text-gray-500 mt-1 line-clamp-2 print:text-gray-600 print:line-clamp-none">Из-за: {item.why}</p>
                    )}

                    <div className="mt-3 text-xs text-orange-500 font-semibold uppercase tracking-wider flex items-center print:hidden">
                        Подробнее <i className="fa-solid fa-arrow-right ml-2 transform group-hover:translate-x-1 transition-transform"></i>
                    </div>

                    <div className="hidden print:block mt-4 border-t border-gray-200 pt-4">
                        <h6 className="font-bold text-black mb-2 text-sm">Техника выполнения:</h6>
                        <ol className="list-decimal list-inside space-y-1 text-sm text-gray-800">
                            {ex.steps.map((step, idx) => (
                                <li key={idx}>{step}</li>
                            ))}
                        </ol>
                    </div>
                </div>
            );
        };

        const ReportView = ({ data }) => {
            const [selectedEx, setSelectedEx] = useState(null);
            const result = useMemo(() => buildCorrectivePlan(data), [data]);
            const { syndromes, plan, overactive, underactive, notes, triggered } = result;
            const hasPlan = ['inhibit', 'lengthen', 'activate', 'integrate'].some(p => plan[p].length > 0);

            const phases = [
                { id: 'inhibit', title: '1. Ингибиция (МФР)', icon: 'fa-solid fa-compress', desc: 'Только мышцы, набравшие вес по находкам' },
                { id: 'lengthen', title: '2. Удлинение (Растяжка)', icon: 'fa-solid fa-up-right-and-down-left-from-center', desc: 'Укороченные мышцы из того же списка' },
                { id: 'activate', title: '3. Активация', icon: 'fa-solid fa-bolt', desc: 'Ослабленные антагонисты' },
                { id: 'integrate', title: '4. Интеграция', icon: 'fa-solid fa-person-running', desc: '1–2 паттерна под ведущий синдром' }
            ];

            const sevColor = { high: 'bg-red-500', mid: 'bg-orange-500', low: 'bg-yellow-500' };

            return (
                <div className="animate-fade-in pb-20">
                    <div className="flex justify-between items-end mb-8 no-print">
                        <div>
                            <h2 className="text-3xl font-bold text-white mb-2">Результаты диагностики</h2>
                            <p className="text-gray-400">План собран по мышцам, не по синдрому целиком</p>
                        </div>
                        <button
                            onClick={() => window.print()}
                            className="bg-gray-700 hover:bg-gray-600 text-white px-6 py-3 rounded-lg transition-colors flex items-center"
                        >
                            <i className="fa-solid fa-print mr-2"></i> Сохранить PDF
                        </button>
                    </div>

                    <div className="hidden print-only mb-8 border-b border-gray-300 pb-4">
                        <h1 className="text-2xl font-bold text-black">ODA PRO: Отчет о диагностике</h1>
                        <p className="text-gray-600">Дата: {new Date().toLocaleDateString()}</p>
                    </div>

                    {!hasPlan ? (
                        <div className="bg-green-500/10 border border-green-500/50 p-8 rounded-xl text-center mb-10">
                            <i className="fa-solid fa-medal text-5xl text-green-500 mb-4"></i>
                            <h3 className="text-2xl font-bold text-green-500 mb-2">Отличный результат!</h3>
                            <p className="text-green-100">Значимых биомеханических нарушений не выявлено. Рекомендуется общая программа физической подготовки.</p>
                        </div>
                    ) : (
                        <>
                            <div className="grid lg:grid-cols-3 gap-8 mb-10">
                                <div className="lg:col-span-1">
                                    <BodyMap overactive={overactive} underactive={underactive} />
                                </div>

                                <div className="lg:col-span-2 space-y-4">
                                    {syndromes.length === 0 && (
                                        <div className="bg-gray-800 p-6 rounded-xl border-l-4 border-gray-500">
                                            <h3 className="text-lg font-bold text-white mb-1">Синдром не набран</h3>
                                            <p className="text-gray-400 text-sm">Находок мало для кластера, план всё равно собран по конкретным мышцам.</p>
                                        </div>
                                    )}
                                    {syndromes.map(syn => (
                                        <div key={syn.id} className="bg-gray-800 p-6 rounded-xl border-l-4 border-orange-500 shadow-lg card">
                                            <div className="flex items-start justify-between gap-4 mb-2">
                                                <h3 className="text-xl font-bold text-white">{syn.name}</h3>
                                                <span className={`text-xs font-bold uppercase tracking-wide px-2 py-1 rounded text-white ${sevColor[syn.severityId]}`}>
                                                    {syn.severity}
                                                </span>
                                            </div>
                                            <p className="text-gray-400 text-sm mb-3">{syn.desc}</p>
                                            <div className="h-1.5 bg-gray-700 rounded-full overflow-hidden mb-3">
                                                <div className="h-full bg-orange-500" style={{ width: `${Math.min(100, (syn.score / syn.max) * 100)}%` }}></div>
                                            </div>
                                            <p className="text-xs text-gray-500">Вес {syn.score}/{syn.max}. Опора: {syn.findings.join('; ')}</p>
                                        </div>
                                    ))}

                                    {notes.map((n, i) => (
                                        <div key={i} className="bg-yellow-500/10 border border-yellow-500/40 text-yellow-200 text-sm p-4 rounded-xl">
                                            {n}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="grid md:grid-cols-2 gap-4 mb-10">
                                <div className="bg-gray-800/70 p-5 rounded-xl border border-gray-700">
                                    <h4 className="text-orange-500 font-bold uppercase text-xs tracking-wider mb-3">Гиперактивные / укороченные</h4>
                                    {overactive.length === 0 ? (
                                        <p className="text-gray-500 text-sm">Не выделены</p>
                                    ) : (
                                        <ul className="space-y-1 text-sm text-gray-300">
                                            {overactive.map(m => (
                                                <li key={m.id} className="flex justify-between">
                                                    <span>{m.name}</span>
                                                    <span className="text-gray-500">{m.score}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    )}
                                </div>
                                <div className="bg-gray-800/70 p-5 rounded-xl border border-gray-700">
                                    <h4 className="text-teal-400 font-bold uppercase text-xs tracking-wider mb-3">Ослабленные</h4>
                                    {underactive.length === 0 ? (
                                        <p className="text-gray-500 text-sm">Не выделены</p>
                                    ) : (
                                        <ul className="space-y-1 text-sm text-gray-300">
                                            {underactive.map(m => (
                                                <li key={m.id} className="flex justify-between">
                                                    <span>{m.name}</span>
                                                    <span className="text-gray-500">{m.score}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    )}
                                </div>
                            </div>

                            {triggered.length > 0 && (
                                <p className="text-xs text-gray-500 mb-8">
                                    Учтено находок: {triggered.map(t => t.label).join(' · ')}
                                </p>
                            )}

                            <div className="space-y-10">
                                {phases.map(phase => {
                                    const items = plan[phase.id];
                                    if (!items.length) return null;

                                    return (
                                        <div key={phase.id} className="card">
                                            <div className="flex items-center mb-6 border-b border-gray-700 pb-2">
                                                <div className="w-10 h-10 rounded-full bg-orange-500 flex items-center justify-center mr-4 text-white">
                                                    <i className={phase.icon}></i>
                                                </div>
                                                <div>
                                                    <h3 className="text-xl font-bold text-white">{phase.title}</h3>
                                                    <p className="text-sm text-gray-500">{phase.desc}</p>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 print:grid-cols-1 print:gap-6">
                                                {items.map(item => (
                                                    <ExerciseCard key={item.id} item={item} onClick={setSelectedEx} />
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </>
                    )}

                    <Modal isOpen={!!selectedEx} onClose={() => setSelectedEx(null)} title={selectedEx?.name}>
                        <div className="space-y-6">
                            {selectedEx?.id && <ExDiagram id={selectedEx.id} />}
                            <p className="text-gray-300 text-lg leading-relaxed">{selectedEx?.desc}</p>
                            {selectedEx?.dose && (
                                <p className="text-orange-400 font-semibold">{selectedEx.dose}</p>
                            )}
                            {selectedEx?.muscles && (
                                <p className="text-sm text-gray-400">Мышцы: {selectedEx.muscles}</p>
                            )}
                            {selectedEx?.why && (
                                <p className="text-sm text-gray-500">На основании: {selectedEx.why}</p>
                            )}

                            <div className="bg-gray-900/50 p-6 rounded-xl border border-gray-700">
                                <h4 className="text-orange-500 font-bold mb-4 uppercase text-sm tracking-wider">Техника выполнения</h4>
                                <ol className="space-y-4">
                                    {selectedEx?.steps.map((step, idx) => (
                                        <li key={idx} className="flex">
                                            <span className="flex-shrink-0 w-8 h-8 rounded-full bg-gray-800 border border-gray-600 flex items-center justify-center text-orange-500 font-bold text-sm mr-4">
                                                {idx + 1}
                                            </span>
                                            <span className="text-gray-200 mt-1">{step}</span>
                                        </li>
                                    ))}
                                </ol>
                            </div>
                        </div>
                    </Modal>

                    <footer className="mt-20 text-center text-gray-600 text-sm print-only">
                        <p>Сгенерировано системой ODA PRO Body Balance</p>
                    </footer>
                </div>
            );
        };

        // --- APP SHELL ---

        const App = () => {
            const [step, setStep] = useState(0);
            const [data, setData] = useState({});

            const updateData = (key, value) => {
                setData(prev => ({ ...prev, [key]: value }));
            };

            const nextStep = () => setStep(s => s + 1);
            const prevStep = () => setStep(s => s - 1);

            const steps = [
                { id: 'intro', component: <StepIntro onStart={nextStep} /> },
                { id: 'safety', component: <StepSafety onNext={nextStep} /> },
                { id: 'static', title: 'Шаг 1: Статика', component: <StepStatic data={data} updateData={updateData} /> },
                { id: 'dynamic', title: 'Шаг 2: Динамика', component: <StepDynamic data={data} updateData={updateData} /> },
                { id: 'mobility', title: 'Шаг 3: Мобильность', component: <StepMobility data={data} updateData={updateData} /> },
                { id: 'report', title: 'Отчет', component: <ReportView data={data} /> }
            ];

            const currentStepObj = steps[step];
            const isWizard = step > 1 && step < steps.length - 1;

            return (
                <div className="container mx-auto px-4 py-8 min-h-screen flex flex-col">
                    {/* Header / Progress */}
                    {step > 0 && (
                        <div className="mb-8 no-print">
                            <div className="flex justify-between items-center mb-4">
                                <button
                                    onClick={prevStep}
                                    className="text-gray-400 hover:text-white transition-colors flex items-center"
                                >
                                    <i className="fa-solid fa-arrow-left mr-2"></i> Назад
                                </button>
                                {isWizard && (
                                    <span className="text-gray-500 font-mono text-sm">
                                        {step - 1} / 3
                                    </span>
                                )}
                            </div>

                            {/* Progress Bar */}
                            {isWizard && (
                                <div className="h-1 bg-gray-800 rounded-full overflow-hidden">
                                    <div
                                        className="h-full bg-orange-500 transition-all duration-500 ease-out"
                                        style={{ width: `${((step - 1) / 3) * 100}%` }}
                                    ></div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Main Content */}
                    <main className="flex-grow">
                        {currentStepObj.component}
                    </main>

                    {/* Wizard Navigation */}
                    {isWizard && (
                        <div className="mt-8 flex justify-end no-print">
                            <button
                                onClick={nextStep}
                                className="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-lg shadow-lg shadow-orange-500/20 transition-all flex items-center"
                            >
                                Далее <i className="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="mt-12 py-6 border-t border-gray-800 text-center text-gray-600 text-sm no-print">
                        <p>ODA PRO: Body Balance System &copy; 2026</p>
                    </footer>
                </div>
            );
        };

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch (e) {
            console.error(e);
            document.body.innerHTML = '<div style="color:red; padding:20px; background:white; z-index:9999; position:relative;"><h1>Render Error</h1><pre>' + e.stack + '</pre></div>';
        }
    </script>
</body>

</html>
